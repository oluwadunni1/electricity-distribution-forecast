[project]
name = "electricity-distribution-forecast"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# Only what the API container needs to run — kept deliberately minimal.
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "mlflow==3.14.0",
    "pandas==2.3.3",
    "scikit-learn==1.9.0",
    "scipy==1.18.0",
    "numpy==2.4.6",
    "xgboost>=2.0",
    "lightgbm>=4.7.0",
    "catboost==1.2.10",
    "cloudpickle==3.1.2",
]

# Everything used in notebooks/training — NOT installed in the API image.
experiments = [
    "dvc>=3.67.1",
    "dvc-s3>=3.3.0",
    "ipykernel>=7.3.0",
    "optuna>=4.9.0",
    "shap>=0.52.0",
    "matplotlib>=3.7",
    "great-expectations",
    "gridstatusio",
    "requests",
    "requests-cache",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
